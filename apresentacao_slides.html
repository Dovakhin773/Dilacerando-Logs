    let currentSlide = 0;
    let showNotes = true;

    function calculateShannon(str) {
      if (!str || str.length === 0) return 0;
      const freq = {};
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        freq[ch] = (freq[ch] || 0) + 1;
      }
      const len = str.length;
      let entropy = 0;
      for (const k in freq) {
        const p = freq[k] / len;
        entropy -= p * Math.log2(p);
      }
      return entropy;
    }

    function updateLiveEntropy() {
      const input = document.getElementById('entropy-input');
      if (!input) return;
      const val = input.value;
      const ent = calculateShannon(val);
      const valEl = document.getElementById('calc-value');
      const lenEl = document.getElementById('calc-len');
      const barEl = document.getElementById('calc-bar');
      const badgeEl = document.getElementById('calc-badge');

      valEl.textContent = ent.toFixed(4);
      lenEl.textContent = val.length;
      const pct = Math.min(100, Math.max(2, (ent / 8.0) * 100));
      barEl.style.width = pct + '%';

      if (ent >= 4.30 && val.length >= 24) {
        badgeEl.textContent = 'ALERTA YARA (>= 4.30)';
        badgeEl.className = 'text-xs font-mono px-2 py-0.5 rounded bg-red-500/20 text-red-300';
        barEl.className = 'h-full bg-red-500 transition-all duration-200';
        valEl.className = 'text-sm text-red-400 font-bold';
      } else if (ent >= 4.00) {
        badgeEl.textContent = 'Suspeito (Moderada)';
        badgeEl.className = 'text-xs font-mono px-2 py-0.5 rounded bg-amber-500/20 text-amber-300';
        barEl.className = 'h-full bg-amber-500 transition-all duration-200';
        valEl.className = 'text-sm text-amber-400 font-bold';
      } else {
        badgeEl.textContent = 'Normal (< 4.30)';
        badgeEl.className = 'text-xs font-mono px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300';
        barEl.className = 'h-full bg-emerald-500 transition-all duration-200';
        valEl.className = 'text-sm text-emerald-400 font-bold';
      }
    }

    function setEntropySample(sample) {
      const input = document.getElementById('entropy-input');
      if (input) {
        input.value = sample;
        updateLiveEntropy();
      }
    }

    function renderSlide() {
      const s = slides[currentSlide];
      const stage = document.getElementById('slide-stage');
      stage.innerHTML = `
        <div>
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <span class="text-xs font-mono font-semibold uppercase tracking-wider text-emerald-400">${s.badge}</span>

          <div>${s.html}</div>
        </div>
        <div class="pt-6 mt-6 border-t border-[var(--border)] flex items-center justify-between text-xs text-[var(--muted-foreground)]">
          <span>Use as setas do teclado <kbd class="px-1.5 py-0.5 rounded bg-[var(--background)] border border-[var(--border)] font-mono">←</kbd> <kbd class="px-1.5 py-0.5 rounded bg-[var(--background)] border border-[var(--border)] font-mono">→</kbd> para navegar</span>
          <span class="font-mono">${s.time}</span>
        </div>
      `;

      document.getElementById('slide-counter').textContent =
        String(currentSlide + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0');
      document.getElementById('progress-bar').style.width = ((currentSlide + 1) / slides.length * 100).toFixed(2) + '%';

      document.getElementById('slide-timer-badge').textContent = s.time;

      renderDots();
      if (currentSlide === 4) {
        updateLiveEntropy();
      }
    }

    function renderDots() {
      const container = document.getElementById('slide-dots');
      container.innerHTML = slides.map((s, idx) => `
        <button onclick="goToSlide(${idx})" title="Slide ${idx + 1}: ${s.title}"
          class="px-2 py-1 rounded text-xs font-mono transition ${idx === currentSlide ? 'bg-emerald-500 text-black font-bold' : 'bg-[var(--card)] text-[var(--muted-foreground)] border border-[var(--border)] hover:opacity-80'}">
          ${idx + 1}
        </button>
      `).join('');
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function goToSlide(idx) {
      currentSlide = idx;
      renderSlide();
    }

    function toggleNotes() {
      showNotes = !showNotes;
      const notesEl = document.getElementById('speaker-notes');
      const btnEl = document.getElementById('btn-notes');
      notesEl.style.display = showNotes ? 'block' : 'none';
      btnEl.textContent = 'Notas do Instrutor: ' + (showNotes ? 'ON' : 'OFF');
    }

    document.addEventListener('keydown', (e) => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    renderSlide();
